<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Temporary rooms joined with a five-digit code. Chat and share files, then the room closes." />
    <meta name="theme-color" content="#F6F4F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1A18" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a theme picked earlier before the page paints, so it never flashes the other one.
      try {
        var theme = localStorage.getItem("coderoom.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Luxurious+Roman&display=swap"
      rel="stylesheet"
    />
    <title>CodeRoom</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
